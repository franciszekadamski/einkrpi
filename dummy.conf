Section "Device"
    Identifier "DummyDevice"
    Driver "dummy"
    VideoRAM 256000
EndSection

Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 30.0-85.0
    VertRefresh 50.0-75.0
    Modeline "800x480_60.00" 29.50 800 824 896 992 480 483 493 500 -hsync +vsync
EndSection

Section "Screen"
    Identifier "DummyScreen"
    Device "DummyDevice"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
	Modes "800x480_60.00" "800x480"
    EndSubSection
EndSection
